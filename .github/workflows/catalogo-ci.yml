name: CI
on:
  push:
    paths: ['catalogo-ropa/**']
  pull_request:
    paths: ['catalogo-ropa/**']
defaults:
  run:
    working-directory: catalogo-ropa
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run demo
