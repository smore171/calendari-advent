<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Catálogo</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<header>
  <strong>Panel de catálogo</strong>
  <div class="filters">
    <select id="f-status"><option value="">Todos los estados</option></select>
    <select id="f-cat"><option value="">Todas las categorías</option></select>
    <label><input type="checkbox" id="f-errors"> Solo con errores</label>
    <input id="f-q" placeholder="Buscar…">
  </div>
  <div class="bulk">
    <span id="sel-count">0 seleccionados</span>
    <button data-bulk="approve">Aprobar</button>
    <select id="bulk-cat"><option value="">Mover a categoría…</option></select>
    <button data-bulk="archive">Archivar</button>
  </div>
</header>
<main>
  <section id="list" class="list"></section>
  <section id="editor" class="editor" hidden></section>
</main>
<script src="/admin.js"></script>
</body>
</html>
